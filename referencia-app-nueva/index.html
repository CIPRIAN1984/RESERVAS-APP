<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ITACA" />
    <meta name="description" content="App del gimnasio ITACA Jiu Jitsu: reservas, asistencia, cinturones e ITACA+" />
    <!-- ?v=2: logotipo nuevo (rebranding); cambia el número para forzar que los navegadores lo vuelvan a pedir -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32" />
    <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preload" href="/fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>ITACA Jiu Jitsu</title>
    <script>
      // Tema antes de pintar (sin destello): oscuro por defecto, claro o sistema desde Ajustes
      (function () {
        var t = 'dark'
        try { t = localStorage.getItem('itaca-tema') || 'dark' } catch (e) {}
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name=theme-color]')
        if (m) m.setAttribute('content', t === 'light' ? '#FFFFFF' : '#121212')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
