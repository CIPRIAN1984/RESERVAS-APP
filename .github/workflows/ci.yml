name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            $(find lib test -name '*.dart' \
            ! -name '*.g.dart' ! -name '*.freezed.dart' \
            ! -path '*/l10n/app_localizations*' \
            ! -path '*/test/golden_archived/*')

      - name: Analyze
        run: flutter analyze

      - name: Verify code generation
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "::error::El código generado (freezed/g.dart) no coincide con el commit. Ejecuta 'dart run build_runner build --delete-conflicting-outputs' y confirma el resultado."
            git diff
            exit 1
          fi

      - name: Test (unit and widget)
        run: flutter test test/app test/core test/shared test/features --exclude-tags=golden

      - name: Test (golden images)
        run: flutter test test/golden --tags=golden

  build-web:
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      # Build without secrets — the app shows its "falta configuración" screen
      # at runtime; this step only proves the web target compiles.
      - name: Build web
        run: flutter build web --release

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Las pruebas pgTAP solo necesitan Postgres. Levantar el resto del
      # stack (edge runtime, studio, realtime, storage...) no aporta nada
      # aquí y sí da guerra: el 03/09/2026 el contenedor del edge runtime
      # se cayó con "Bus error (core dumped)" y tumbó el job entero antes
      # de ejecutar una sola prueba. Con solo la base de datos, las 275
      # pruebas pasan igual y hay 13 contenedores menos que puedan fallar.
      - name: Start local Supabase stack (solo la base de datos)
        run: >
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP RLS tests
        run: supabase test db --verbose 2>&1 | tee supabase-test.log

      - name: Upload Supabase test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-test-logs
          path: supabase-test.log
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check push function formatting
        run: deno fmt --check supabase/functions/send-push/index.ts
      - name: Type-check push function
        run: deno check supabase/functions/send-push/index.ts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate operational scripts
        run: bash -n scripts/production-smoke.sh
