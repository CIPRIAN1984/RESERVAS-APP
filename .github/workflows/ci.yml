name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (hand-written code)
        run: |
          set +e
          dart format --output=none --set-exit-if-changed \
            $(find lib test -name '*.dart' \
            ! -name '*.g.dart' ! -name '*.freezed.dart' \
            ! -path '*/l10n/app_localizations*')
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            dart format \
              $(find lib test -name '*.dart' \
              ! -name '*.g.dart' ! -name '*.freezed.dart' \
              ! -path '*/l10n/app_localizations*')
            git --no-pager diff -- lib test
            exit "$status"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Verify code generation is in sync
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "::error::Los ficheros generados (*.g.dart / *.freezed.dart) están desactualizados. Ejecuta build_runner y haz commit."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Test (excluye golden tests — ver docs/GOLDEN_TESTS.md)
        run: flutter test --exclude-tags=golden 2>&1

  build-web:
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Build without secrets — the app shows its "falta configuración" screen
      # at runtime; this step only proves the web target compiles.
      - name: Build web
        run: flutter build web --release

  build-android:
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Firebase and release credentials are intentionally absent in ordinary
      # CI. This proves the native Android target remains compilable.
      - name: Build debug APK
        run: flutter build apk --debug

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Run pgTAP RLS tests
        run: supabase test db --verbose 2>&1 | tee supabase-test.log

      - name: Upload Supabase test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-test-logs
          path: supabase-test.log
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check push function formatting
        run: deno fmt --check supabase/functions/send-push/index.ts
      - name: Type-check push function
        run: deno check supabase/functions/send-push/index.ts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate operational scripts
        run: bash -n scripts/production-smoke.sh
