name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (hand-written code)
        run: >
          dart format --output=none --set-exit-if-changed
          $(find lib test -name '*.dart'
          ! -name '*.g.dart' ! -name '*.freezed.dart'
          ! -path '*/l10n/app_localizations*')

      - name: Analyze
        run: flutter analyze

      - name: Verify code generation is in sync
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "::error::Los ficheros generados (*.g.dart / *.freezed.dart) están desactualizados. Ejecuta build_runner y haz commit."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Test
        run: flutter test

  build-web:
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Build without secrets — the app shows its "falta configuración" screen
      # at runtime; this step only proves the web target compiles.
      - name: Build web
        run: flutter build web --release

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Run pgTAP RLS tests
        run: supabase test db

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
